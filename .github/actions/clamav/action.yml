name: clamav
description: Install ClamAV and update its signatures (run once per job; the signature database is cached by date)
runs:
  using: composite
  steps:
    - name: Get date for the ClamAV database cache
      id: date
      shell: bash
      run: echo "value=$(date +%F)" >> "$GITHUB_OUTPUT"

    - name: Cache ClamAV signatures
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/clamav-db
        key: clamav-${{ steps.date.outputs.value }}
        restore-keys: clamav-

    - name: Install ClamAV and update signatures
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends clamav
        # 自動更新のサービスが、次の freshclam と競合しないようにする
        sudo systemctl stop clamav-freshclam.service || true
        # freshclam は AppArmor で、/etc/clamav/freshclam.conf と /var/lib/clamav 以外を読み書きできない
        # 設定ファイルをホームに置くと開けないため、標準の設定と /var/lib/clamav で更新し、キャッシュのディレクトリと入れ替える
        mkdir -p ~/clamav-db
        sudo cp -a ~/clamav-db/. /var/lib/clamav/
        sudo chown -R clamav:clamav /var/lib/clamav
        sudo freshclam
        sudo cp -a /var/lib/clamav/. ~/clamav-db/
        sudo chown -R "$(id -u):$(id -g)" ~/clamav-db
